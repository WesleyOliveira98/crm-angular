<aside class="sidebar" [class.open]="menuOpen()">
  <div class="brand">
    <span class="logo" aria-hidden="true"
      ><span></span><span></span><span></span><span></span
    ></span>
    <span>Sales CRM</span>
  </div>

  <nav>
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" (click)="menuOpen.set(false)">
        {{ link.label }}
      </a>
    }
  </nav>
</aside>

@if (menuOpen()) {
  <div class="backdrop" (click)="menuOpen.set(false)"></div>
}

<div class="main">
  <header class="topbar">
    <button
      class="menu-button"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
    >
      Menu
    </button>

    <span class="user">{{ auth.currentUser()?.name }}</span>
    <button class="btn" type="button" (click)="auth.logout()">Sair</button>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
